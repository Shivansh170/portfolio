<div class="fixed bottom-6 right-6 z-50 flex flex-col gap-2.5 max-w-md w-full px-4 sm:px-0 pointer-events-none" aria-live="polite">
  @for (toast of portfolioService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-center justify-between gap-3 px-4 py-3.5 rounded-xl bg-slate-900 text-white shadow-2xl ring-1 ring-white/10 border-l-4 transition-all duration-200"
      [ngClass]="{
        'border-emerald-500': toast.type === 'success',
        'border-orange-500': toast.type === 'info',
        'border-amber-500': toast.type === 'warning'
      }"
    >
      <div class="flex items-center gap-3 min-w-0">
        @if (toast.type === 'success') {
          <div class="w-6 h-6 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
            </svg>
          </div>
        } @else if (toast.type === 'info') {
          <div class="w-6 h-6 rounded-full bg-orange-500/20 text-orange-400 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
        } @else {
          <div class="w-6 h-6 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
          </div>
        }
        <span class="text-sm font-medium text-white tracking-wide truncate">
          {{ toast.message }}
        </span>
      </div>

      <button
        (click)="portfolioService.dismissToast(toast.id)"
        class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors shrink-0"
        aria-label="Dismiss toast"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  }
</div>
