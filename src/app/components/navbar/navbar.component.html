<header class="sticky top-0 z-40 w-full bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
  <div class="max-w-5xl mx-auto px-4 sm:px-6">
    <div class="flex items-center justify-between h-16">
      
      <!-- Brand -->
      <a routerLink="/" class="flex items-center gap-2.5 group">
        <div class="w-9 h-9 rounded-xl bg-orange-600 text-white font-bold text-sm flex items-center justify-center shadow-xs group-hover:bg-orange-700 transition-all duration-200 group-hover:scale-105">
          SL
        </div>
        <div class="flex flex-col">
          <span class="text-base sm:text-lg font-bold text-slate-900 tracking-tight group-hover:text-orange-600 transition-colors">
            Shivansh Lavaniya
          </span>
          <span class="text-xs font-mono text-slate-500 hidden sm:block">Full Stack Engineer</span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <nav class="hidden md:flex items-center gap-1.5 text-sm sm:text-base font-medium text-slate-600">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="text-orange-600 bg-orange-50/90 font-semibold"
          class="px-3.5 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition-colors"
        >
          Home
        </a>
        <a
          routerLink="/projects"
          routerLinkActive="text-orange-600 bg-orange-50/90 font-semibold"
          class="px-3.5 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition-colors"
        >
          Projects
        </a>
        <a
          routerLink="/experience"
          routerLinkActive="text-orange-600 bg-orange-50/90 font-semibold"
          class="px-3.5 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition-colors"
        >
          Experience
        </a>
        <a
          routerLink="/skills"
          routerLinkActive="text-orange-600 bg-orange-50/90 font-semibold"
          class="px-3.5 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition-colors"
        >
          Skills
        </a>
        <a
          routerLink="/contact"
          routerLinkActive="text-orange-600 bg-orange-50/90 font-semibold"
          class="px-3.5 py-2 rounded-xl hover:text-slate-900 hover:bg-slate-100 transition-colors"
        >
          Contact
        </a>
      </nav>

      <!-- Desktop Actions -->
      <div class="hidden sm:flex items-center gap-3">
        <button
          (click)="portfolioService.openResumeModal()"
          class="px-3.5 py-2 text-xs sm:text-sm font-semibold rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 hover:border-slate-400 transition-colors cursor-pointer active:scale-95"
        >
          Resume
        </button>
        <a
          routerLink="/contact"
          class="px-4 py-2 text-xs sm:text-sm font-semibold rounded-xl bg-orange-600 text-white hover:bg-orange-700 transition-all duration-200 shadow-xs cursor-pointer active:scale-95"
        >
          Get in Touch
        </a>
      </div>

      <!-- Mobile Hamburger Button -->
      <div class="flex items-center gap-2 md:hidden">
        <button
          (click)="portfolioService.openResumeModal()"
          class="px-3 py-1.5 text-xs font-semibold rounded-lg border border-slate-300 text-slate-700 cursor-pointer"
        >
          Resume
        </button>
        <button
          (click)="mobileMenuOpen.set(!mobileMenuOpen())"
          class="p-2 rounded-lg text-slate-700 hover:bg-slate-100 cursor-pointer"
          aria-label="Toggle navigation"
        >
          @if (!mobileMenuOpen()) {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          } @else {
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Menu Dropdown -->
  @if (mobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-200 bg-white px-4 py-3 space-y-1.5">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="mobileMenuOpen.set(false)"
        routerLinkActive="text-orange-600 bg-orange-50 font-semibold"
        class="block px-3.5 py-2.5 rounded-xl text-base text-slate-700 hover:bg-slate-50"
      >
        Home
      </a>
      <a
        routerLink="/projects"
        (click)="mobileMenuOpen.set(false)"
        routerLinkActive="text-orange-600 bg-orange-50 font-semibold"
        class="block px-3.5 py-2.5 rounded-xl text-base text-slate-700 hover:bg-slate-50"
      >
        Projects
      </a>
      <a
        routerLink="/experience"
        (click)="mobileMenuOpen.set(false)"
        routerLinkActive="text-orange-600 bg-orange-50 font-semibold"
        class="block px-3.5 py-2.5 rounded-xl text-base text-slate-700 hover:bg-slate-50"
      >
        Experience
      </a>
      <a
        routerLink="/skills"
        (click)="mobileMenuOpen.set(false)"
        routerLinkActive="text-orange-600 bg-orange-50 font-semibold"
        class="block px-3.5 py-2.5 rounded-xl text-base text-slate-700 hover:bg-slate-50"
      >
        Skills
      </a>
      <a
        routerLink="/contact"
        (click)="mobileMenuOpen.set(false)"
        routerLinkActive="text-orange-600 bg-orange-50 font-semibold"
        class="block px-3.5 py-2.5 rounded-xl text-base text-slate-700 hover:bg-slate-50"
      >
        Contact
      </a>
    </div>
  }
</header>
